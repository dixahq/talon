[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "talon"
version = "1.4.8"
description = ""
authors = []
readme = "README.rst"
packages = [{include = "talon"}]

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
cssselect = "^1.2.0"
html5lib = "^1.1"
joblib = {version = "^1.3.2", optional = true}
lxml = "^6.1.0"
numpy = {version = "^1.26.0", optional = true}
regex = "^2023.8.8"
scikit-learn = {version = "^1.3.1", optional = true}
six = "^1.16.0"

[tool.poetry.extras]
ml = ["joblib", "numpy", "scikit-learn"]

[tool.poetry.group.dev.dependencies]
coverage = "^7.3.1"
mock = "^5.1.0"
pynose = "^1.4.8"
